state_dir = "~/.local/state/MailSalonSync"

[[accounts]]
name = "personal-imap"
protocol = "imap"
local_root = "~/Mail/personal"
propagate_deletes = true

[[accounts.mailboxes]]
remote = "INBOX"
local = "INBOX"

[[accounts.mailboxes]]
remote = "Archive"
local = "Archive"

[accounts.imap]
address = "imap.example.com:993"
username = "me@example.com"
password_env = "PERSONAL_IMAP_PASSWORD"
security = "tls"

[[accounts]]
name = "work-jmap"
protocol = "jmap"
local_root = "~/Mail/work"
propagate_deletes = true

[[accounts.mailboxes]]
remote = "role:inbox"
local = "INBOX"

[[accounts.mailboxes]]
remote = "role:sent"
local = "Sent"

[[accounts.mailboxes]]
remote = "role:junk"
local = "Junk"

# A normal manually-created mailbox named Archive works; no JMAP role is
# required. If your server provides an archive role, role:archive also works.
[[accounts.mailboxes]]
remote = "Archive"
local = "Archive"

[accounts.jmap]
session_url = "https://mail.example.net/.well-known/jmap"
auth = "basic"
username = "me@example.net"
password_env = "WORK_JMAP_PASSWORD"
drafts_mailbox = "role:drafts"
sent_mailbox = "role:sent"
