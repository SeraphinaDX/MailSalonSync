<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <!-- Dark Retro Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0017" />
      <stop offset="50%" stop-color="#2d0b2e" />
      <stop offset="100%" stop-color="#0f021a" />
    </linearGradient>

    <!-- Glowing Text Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff2a85" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Grid Pattern Overlay (Pixel Vibe) -->
  <g opacity="0.05" fill="#ffffff">
    <path d="M0 0h512v8H0zM0 32h512v8H0zM0 64h512v8H0zM0 96h512v8H0zM0 128h512v8H0zM0 160h512v8H0zM0 192h512v8H0zM0 224h512v8H0zM0 256h512v8H0zM0 288h512v8H0zM0 320h512v8H0zM0 352h512v8H0zM0 384h512v8H0zM0 416h512v8H0zM0 448h512v8H0zM0 480h512v8H0z"/>
  </g>

  <!-- BACKGROUND PIXEL SPARKLES & HEART DECORATIONS -->
  <!-- Sparkle 1 (Top Left) -->
  <g fill="#ff99dd">
    <rect x="70" y="90" width="12" height="36" />
    <rect x="58" y="102" width="36" height="12" />
    <rect x="82" y="102" width="12" height="12" fill="#ffffff" />
  </g>
  <!-- Sparkle 2 (Top Right) -->
  <g fill="#00ffff">
    <rect x="410" y="120" width="10" height="30" />
    <rect x="400" y="130" width="30" height="10" />
    <rect x="410" y="130" width="10" height="10" fill="#ffffff" />
  </g>
  <!-- Pixel Heart (Right) -->
  <g fill="#ff2a85">
    <rect x="420" y="240" width="8" height="8" />
    <rect x="436" y="240" width="8" height="8" />
    <rect x="412" y="248" width="40" height="16" />
    <rect x="420" y="264" width="24" height="8" />
    <rect x="428" y="272" width="8" height="8" />
  </g>

  <!-- MAIN LOGO ICON: PIXEL NAIL POLISH BOTTLE + GIT BRANCH -->
  <g transform="translate(136, 60)">
    
    <!-- 1. BOTTLE CAP (Black / Dark Magenta Accent) -->
    <!-- Cap Outline -->
    <rect x="80" y="20" width="80" height="100" fill="#11001c" />
    <!-- Cap Body -->
    <rect x="88" y="28" width="64" height="84" fill="#2d1235" />
    <!-- Cap Highlights & Ridges -->
    <rect x="96" y="28" width="8" height="84" fill="#5c256f" />
    <rect x="120" y="28" width="16" height="84" fill="#ff77c8" />

    <!-- 2. BRUSH STEM & COLLAR -->
    <rect x="104" y="120" width="32" height="16" fill="#11001c" />
    <rect x="112" y="120" width="16" height="16" fill="#e2e8f0" />

    <!-- 3. GLASS BOTTLE OUTLINE -->
    <rect x="48" y="136" width="144" height="176" fill="#11001c" />

    <!-- 4. NAIL POLISH LIQUID (Hot Pink Base) -->
    <rect x="56" y="144" width="128" height="160" fill="#ff1493" />
    <rect x="56" y="176" width="128" height="128" fill="#ff2a85" />

    <!-- Liquid Shading / Gradient Blocks -->
    <rect x="56" y="256" width="128" height="48" fill="#d6006e" />
    <rect x="56" y="288" width="128" height="16" fill="#99004c" />

    <!-- Glass Bottle Inner Corner Cutouts (Pixel Rounding) -->
    <rect x="48" y="136" width="16" height="16" fill="#11001c" />
    <rect x="176" y="136" width="16" height="16" fill="#11001c" />
    <rect x="48" y="296" width="16" height="16" fill="#11001c" />
    <rect x="176" y="296" width="16" height="16" fill="#11001c" />

    <!-- 5. GLASS REFLECTIONS (Cute Glint) -->
    <rect x="64" y="152" width="16" height="112" fill="#ffffff" opacity="0.8" />
    <rect x="80" y="152" width="16" height="32" fill="#ffffff" opacity="0.8" />
    <rect x="168" y="272" width="8" height="24" fill="#ffffff" opacity="0.6" />

    <!-- 6. GIT FORGE NODE EMBLEM (Embedded on Bottle Label) -->
    <!-- Git Branch Line (White Pixel Art) -->
    <rect x="100" y="184" width="8" height="80" fill="#ffffff" />
    <rect x="108" y="220" width="24" height="8" fill="#ffffff" />
    <rect x="132" y="200" width="8" height="28" fill="#ffffff" />
    
    <!-- Git Nodes / Hearts (Pastel Cyan & Yellow) -->
    <!-- Base Node -->
    <rect x="92" y="256" width="24" height="24" fill="#00ffff" />
    <rect x="96" y="260" width="16" height="16" fill="#ffffff" />
    <!-- Branch Node 1 (Top Left Commit) -->
    <rect x="92" y="176" width="24" height="24" fill="#ffe600" />
    <rect x="96" y="180" width="16" height="16" fill="#ffffff" />
    <!-- Branch Node 2 (Top Right Commit) -->
    <rect x="124" y="192" width="24" height="24" fill="#00ffff" />
    <rect x="128" y="196" width="16" height="16" fill="#ffffff" />

    <!-- 7. DRIPPING POLISH (Bottom Right - Git Feature) -->
    <rect x="152" y="312" width="24" height="16" fill="#ff2a85" />
    <rect x="160" y="328" width="16" height="24" fill="#ff2a85" />
    <rect x="160" y="352" width="8" height="8" fill="#ff2a85" />
    <!-- Drip Highlight -->
    <rect x="152" y="312" width="8" height="8" fill="#ff99dd" />
  </g>

  <!-- TYPOGRAPHY / LOGO TEXT -->
  <!-- "MailSalon" in Bold Pixel Style -->
  <g filter="url(#glow)" fill="#ffffff" font-family="'Courier New', monospace, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="435" font-size="38" letter-spacing="2" fill="#ff77c8">MailSalon</text>
    <text x="256" y="432" font-size="38" letter-spacing="2" fill="#ffffff">MailSalon</text>
  </g>

  <!-- "SYNC / GIT FORGE" Subtitle -->
  <g font-family="'Courier New', monospace, sans-serif" font-weight="bold" text-anchor="middle">
    <!-- Pixelized Banner Box -->
    <rect x="156" y="452" width="200" height="28" fill="#00ffff" />
    <rect x="160" y="456" width="192" height="20" fill="#11001c" />
    <text x="256" y="471" font-size="14" fill="#00ffff" letter-spacing="4">SYNC :: FORGE</text>
  </g>

  <!-- FRONT SPARKLES (Overlapping Text/Bottle) -->
  <g fill="#ffffff">
    <rect x="120" y="380" width="6" height="6" />
    <rect x="380" y="390" width="8" height="8" fill="#ffe600" />
    <rect x="340" y="100" width="6" height="6" />
  </g>
</svg>
